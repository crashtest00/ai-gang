services:
  dev:
    build: .
    container_name: hello-desktop-dev
    stdin_open: true
    tty: true
    env_file: .env
    volumes:
      - ./src:/workspace
      - ../../setup:/agent-docs:ro
    command: sh -c "gh auth setup-git && tail -f /dev/null"
    restart: unless-stopped
    networks:
      - ai-gang

networks:
  ai-gang:
    external: true
