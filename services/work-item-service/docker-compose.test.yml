# Ephemeral pytest fixtures: Postgres and Redis only.
#
# No artifact volume here, deliberately. The suite runs on the host, not in
# a container, and the artifact-ingress tests point ARTIFACT_ROOT
# (workitemservice/settings.py) at pytest's own per-test tmp_path — a
# shared volume would only let one test's files leak into another's. The
# real mount is docker-compose.yml's `artifact-data`.
services:
  workitem-test-postgres:
    image: postgres:16-alpine
    container_name: workitem-test-postgres-django
    environment:
      - POSTGRES_USER=workitem
      - POSTGRES_PASSWORD=workitem
      - POSTGRES_DB=workitem
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Without this, `docker compose up --wait` returns as soon as the
    # container is running, which on a cold start is well before Postgres
    # accepts connections — every test then errors on a refused connection.
    # With it, --wait means what it says.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workitem -d workitem"]
      interval: 1s
      timeout: 3s
      retries: 60
      start_period: 5s

  workitem-test-redis:
    image: redis:7-alpine
    container_name: workitem-test-redis-django
    ports:
      - "16399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30
