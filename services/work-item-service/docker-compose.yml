# AI Gang Internal Work-Item Service — deployment stack.
# (the internal-work-item-service design; standing this up is
# called out explicitly in the V2-E2E-TEST-PLAN design's Phase 2.1-2.4
# section as new-for-V2 work, distinct from docker-compose.test.yml's
# ephemeral pytest fixtures.)
#
# Four services from one image (see Dockerfile):
#   - postgres   — persistent datastore (named volume, not tmpfs)
#   - migrate    — one-shot `manage.py migrate`; others wait on its clean exit
#   - api        — HTTP surface (REQ-04/REQ-08), container name
#                   "work-item-service" to match scrummaster's
#                   canonicalWorkItems.js default WORKITEM_SERVICE_URL
#                   (http://work-item-service:9100)
#   - relay      — outbox relay (REQ-06), its own container so it can be
#                   killed/restarted independently of api/consumers
#   - consumers  — Streams command + webhook consumers (REQ-03/REQ-09/REQ-11)
services:
  workitem-postgres:
    image: postgres:16-alpine
    container_name: workitem-postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    volumes:
      - workitem-postgres-data:/var/lib/postgresql/data
    networks:
      - ai-gang
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: python manage.py migrate --noinput
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    depends_on:
      workitem-postgres:
        condition: service_healthy

  api:
    build: .
    container_name: work-item-service
    env_file: .env
    command: gunicorn workitemservice.wsgi:application --bind 0.0.0.0:9100
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  relay:
    build: .
    container_name: workitem-relay
    env_file: .env
    command: python manage.py relay
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumers:
    build: .
    container_name: workitem-consumers
    env_file: .env
    command: python manage.py run_consumers
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  ai-gang:
    external: true

volumes:
  workitem-postgres-data:
