# AI Gang Internal Work-Item Service — deployment stack, distinct from
# docker-compose.test.yml's ephemeral pytest fixtures.
#
# Four services from one image (see Dockerfile):
#   - postgres   — persistent datastore (named volume, not tmpfs)
#   - migrate    — one-shot `manage.py migrate`; others wait on its clean exit
#   - api        — HTTP surface, container name
#                   "work-item-service" to match scrummaster's
#                   canonicalWorkItems.js default WORKITEM_SERVICE_URL
#                   (http://work-item-service:9100)
#   - relay      — outbox relay, its own container so it can be
#                   killed/restarted independently of api/consumers
#   - consumers  — Streams command + webhook consumers
services:
  workitem-postgres:
    image: postgres:16-alpine
    container_name: workitem-postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${PGUSER}
      - POSTGRES_PASSWORD=${PGPASSWORD}
      - POSTGRES_DB=${PGDATABASE}
    volumes:
      - workitem-postgres-data:/var/lib/postgresql/data
    networks:
      - ai-gang
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER} -d ${PGDATABASE}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    env_file: .env
    command: python manage.py migrate --noinput
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    depends_on:
      workitem-postgres:
        condition: service_healthy

  api:
    build: .
    container_name: work-item-service
    env_file: .env
    command: gunicorn workitemservice.wsgi:application --bind 0.0.0.0:9100
    environment:
      # The artifact volume's mount point inside the container; matches
      # workitemservice/settings.py's ARTIFACT_ROOT default. Stated here
      # rather than left implicit so the mount below and the setting can
      # be checked against each other in one place.
      - ARTIFACT_ROOT=/var/lib/aigang/artifacts
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - ../scrummaster/config:/app/config:ro
      # Artifact ingress (strategy/v4.0/features/artifact-ingress.md
      # REQ-02). Only `api` mounts it: `api` is the one service that
      # uploads (the Django admin) and reads artifact bytes. Not read-only
      # — an upload writes here — and a named volume rather than a bind
      # mount so the bytes survive container recreation.
      - artifact-data:/var/lib/aigang/artifacts
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  relay:
    build: .
    container_name: workitem-relay
    env_file: .env
    command: python manage.py relay
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  consumers:
    build: .
    container_name: workitem-consumers
    env_file: .env
    command: python manage.py run_consumers
    volumes:
      - ../scrummaster/config:/app/config:ro
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

networks:
  ai-gang:
    external: true

volumes:
  workitem-postgres-data:
  # Artifact files. The host path `docker volume inspect
  # work-item-service_artifact-data` reports is where a human edits a
  # stored artifact in place (REQ-02); see artifacts/README.md for the
  # layout under it.
  artifact-data:
