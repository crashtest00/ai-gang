# AI Gang Memory — V6's Memory: the session archive (Durable Agent Session
# Record, §4), artifact text extraction, the corpus index and knowledge
# retrieval. Its own images, its own PostgreSQL and its own named archive
# volume, on the shared `ai-gang` network. It never connects to Core's
# database, and nothing on the dispatch path waits for it (REQ-02).
#
#   - memory-postgres — Memory's database: the manifest, extraction records and jobs,
#                       the corpus index and the retrieval query log
#   - migrate         — one-shot `manage.py migrate`; the others wait on it
#   - memory-copier   — copies every session from the shared harness volume
#                       into the archive: file-change events plus the
#                       reconciling pass (REQ-03); session status (REQ-06)
#   - memory-api      — the manifest, file, notes and counts reads and the
#                       changed-since listing (REQ-08, REQ-09), and knowledge
#                       retrieval: POST/GET /retrieve and
#                       GET /retrieve/queries/<id>
#                       (strategy/v6.0/v6.1/features/knowledge-retrieval.md);
#                       it reads Core and Redis on ai-gang at query time
#   - memory-extraction — artifact text extraction's dispatcher
#                       (strategy/v6.0/v6.1/features/artifact-text-extraction.md):
#                       consumes artifact.uploaded events, runs the
#                       reconciliation sweep, keeps the extraction record and
#                       job store in memory-postgres, and hands each file to
#                       memory-extractor through the spool volume
#   - memory-extractor — parses those files (REQ-05): its own image
#                       (extractor/), no database, no Redis, no network
#   - memory-indexer  — the corpus index
#                       (strategy/v6.0/v6.1/features/corpus-indexing.md): reads
#                       Core's event streams and enumerations, the archive
#                       through memory-api, the extraction record, and the
#                       platform corpus from this Source checkout's git
#                       history; keeps the index in memory-postgres
#
# scripts/startup/start-memory.sh creates the shared harness volume
# (`docker volume create aigang-harness`) and then brings this stack up.
services:
  memory-postgres:
    image: postgres:16-alpine
    container_name: memory-postgres
    # POSTGRES_USER/PASSWORD/DB come from .env alone, never from ${...}
    # interpolation: Compose reads the calling process's environment first,
    # and platform startup runs with Core's PGUSER/PGPASSWORD/PGDATABASE
    # loaded, which would initialise this database with Core's credential.
    env_file: .env
    volumes:
      - memory-postgres-data:/var/lib/postgresql/data
    networks:
      - ai-gang
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    image: aigang-memory
    env_file: .env
    command: python manage.py migrate --noinput
    networks:
      - ai-gang
    depends_on:
      memory-postgres:
        condition: service_healthy

  memory-copier:
    build: .
    image: aigang-memory
    container_name: memory-copier
    env_file: .env
    command: python manage.py run_copier
    # Root: the harness writes transcripts 0600 as its own uid (REQ-01; the
    # session pickup spike §9.5, S1), and only that uid or root can read them.
    user: "0:0"
    environment:
      - MEMORY_HARNESS_ROOT=/harness
      - MEMORY_ARCHIVE_ROOT=/var/lib/aigang/memory/archive
    volumes:
      # The whole shared harness volume, read-only: every project is one
      # subdirectory of it, so adding a project never changes this file.
      - aigang-harness:/harness:ro
      - memory-archive:/var/lib/aigang/memory/archive
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  memory-api:
    build: .
    image: aigang-memory
    container_name: memory-api
    env_file: .env
    command: gunicorn memory.wsgi:application --bind 0.0.0.0:9200
    environment:
      - MEMORY_ARCHIVE_ROOT=/var/lib/aigang/memory/archive
    volumes:
      - memory-archive:/var/lib/aigang/memory/archive:ro
    networks:
      ai-gang:
        aliases:
          - memory
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  memory-extraction:
    build: .
    image: aigang-memory
    container_name: memory-extraction
    env_file: .env
    command: python manage.py run_extraction
    environment:
      - MEMORY_EXTRACTION_SPOOL=/var/lib/aigang/memory/extraction-spool
    volumes:
      - memory-extraction-spool:/var/lib/aigang/memory/extraction-spool
    # Reads Core's artifact surface (http://core:9100) and Redis on ai-gang.
    # It never parses a file: that is memory-extractor's, below (REQ-05).
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  memory-extractor:
    build: ./extractor
    image: aigang-memory-extractor
    container_name: memory-extractor
    command: python -m extractor --spool /spool
    # REQ-05: parses untrusted files, so it is reachable from no network and
    # can reach none (brief I-17's reading of "client network": it has no
    # interface on ai-gang or any other network, no listening socket and no
    # published port). No env file: it holds no credential of any kind. Its
    # one interface is the spool volume it shares with memory-extraction.
    network_mode: none
    volumes:
      - memory-extraction-spool:/spool
    restart: unless-stopped

  memory-indexer:
    build: .
    image: aigang-memory
    container_name: memory-indexer
    env_file: .env
    command: python manage.py run_indexer
    environment:
      - MEMORY_API_URL=http://memory-api:9200
      - MEMORY_PLATFORM_CORPUS_ROOT=/platform-source
    volumes:
      # The platform corpus (REQ-08): the Markdown under docs/ and setup/ in
      # this deployment's own Source checkout, read at its current commit,
      # so only the checkout's git directory is mounted, read-only. The
      # working tree, and the platform .env in it, is not mounted.
      - ../../.git:/platform-source/.git:ro
    # Reads Core (http://core:9100), Redis and memory-api on ai-gang. It
    # never mounts the harness volume or the archive (REQ-01): sessions and
    # notes are read through memory-api.
    networks:
      - ai-gang
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      memory-api:
        condition: service_started

networks:
  ai-gang:
    external: true

volumes:
  memory-postgres-data:
  # The archive: the only copy of a session once the harness has deleted it
  # from the source volume, so never treated as disposable (§4).
  memory-archive:
  # Files in flight between memory-extraction and memory-extractor, and their
  # results. Disposable: a lost spool costs a retry of the jobs in flight,
  # which the job store in memory-postgres still holds (REQ-07).
  memory-extraction-spool:
  # The shared harness volume. External, as in every project's compose file,
  # so no `docker compose down -v` here or in a project deletes it.
  aigang-harness:
    external: true
    name: aigang-harness
